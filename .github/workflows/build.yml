name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to publish a release from a tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # The hosted runner image already ships the SDK, and re-installing into it
      # has been failing, so only download what is genuinely missing. The listing
      # is kept in the log to make any future mismatch obvious.
      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms ---";   ls "$ANDROID_HOME/platforms"   2>/dev/null || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          if [ -d "$ANDROID_HOME/platforms/android-34" ] && [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "Required SDK packages already present; skipping install."
            exit 0
          fi
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The keystore only exists when the repository secret is set, so forks and
      # pull requests (which never receive secrets) still build: the Gradle config
      # falls back to debug signing when ESPRESENSE_KEYSTORE is unset or missing.
      # The secret is passed through the environment rather than interpolated into
      # the script, so it never lands on the shell command line.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded ($(stat -c%s "$RUNNER_TEMP/release.jks") bytes)."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_B64 is not set - falling back to debug signing."
          fi

      # Gradle reports bad signing credentials as an opaque task failure, so check
      # them up front and say plainly what is wrong. A trailing newline picked up
      # when pasting the secret is the usual culprit.
      - name: Verify keystore credentials
        if: steps.keystore.outputs.signed == 'true'
        env:
          KS: ${{ steps.keystore.outputs.path }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ALIAS="${ALIAS:-espresense-node}"
          if ! keytool -list -keystore "$KS" -storepass "$PW" >/dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD was rejected by the keystore (or KEYSTORE_B64 is truncated). A trailing newline or space in the secret is the usual cause."
            exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass "$PW" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Alias '$ALIAS' is not in the keystore. Available private keys:"
            keytool -list -keystore "$KS" -storepass "$PW" 2>/dev/null \
              | grep PrivateKeyEntry | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          echo "Keystore credentials OK (alias $ALIAS)."

      # versionCode must increase monotonically or Android rejects the install as
      # a downgrade, so it tracks the run number; versionName comes from the tag.
      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building version $NAME (versionCode $GITHUB_RUN_NUMBER)"

      - name: Build release APK
        env:
          ESPRESENSE_KEYSTORE: ${{ steps.keystore.outputs.path }}
          ESPRESENSE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ESPRESENSE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ESPRESENSE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ESPRESENSE_VERSION_NAME: ${{ steps.version.outputs.name }}
          ESPRESENSE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -o pipefail
          if ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log; then
            exit 0
          fi
          # Promote the cause into annotations so the failure is diagnosable
          # without downloading the log archive. Secrets stay masked by the runner.
          { sed -n '/^FAILURE:/,$p' /tmp/build.log | grep -v '^> Task' | head -n 25
            sed -n '/^FAILURE:/,$p' /tmp/build.log | grep -q . || tail -n 25 /tmp/build.log
          } | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          exit 1

      # A silent fallback to debug signing would produce an APK that cannot update
      # installed nodes, so assert the expected signing identity explicitly.
      - name: Verify APK signature
        env:
          EXPECTED: 77173a12bdaa2c1c9966202e87c9dcf7c75f2ee634a598df8f7c03e01d31799b
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK"
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | grep -qi "$EXPECTED" \
              || { echo "::error::APK is not signed with the expected release key"; exit 1; }
            echo "Signature matches the expected release key."
          fi

      - name: Rename APK
        id: apk
        run: |
          DEST="espresense-node-${{ steps.version.outputs.name }}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: espresense-node-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
